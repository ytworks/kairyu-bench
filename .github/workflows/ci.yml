name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e . ruff==0.12.9 mypy==1.17.1
      - run: python -m unittest discover -s tests -v
      - run: ruff check .
      - run: mypy --ignore-missing-imports src
      - run: find . -type f -name '*.sh' -not -path './.git/*' -exec sh -n {} +

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Lint workflows
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color
      - name: Lint Dockerfile
        run: docker run --rm -i hadolint/hadolint:v2.12.0 < Dockerfile
      - run: docker build -t kairyu-bench:ci .
      - run: docker run --rm kairyu-bench:ci list
      - run: docker run --rm kairyu-bench:ci run https://example.test/v1 --only gpqa-diamond --limit 1 --dry-run
      - name: Check nested Docker access
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock --entrypoint docker kairyu-bench:ci version --format '{{.Server.Version}}'
