[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kairyu-sparse-overlay-experiment"
version = "0.1.0"
requires-python = ">=3.11"
description = "Pinned Gemma4 BF16 load-time sparse overlay experiment"

[project.entry-points."vllm.general_plugins"]
kairyu_sparse_overlay = "kairyu_sparse_overlay:register"

[tool.setuptools.packages.find]
where = ["src"]
